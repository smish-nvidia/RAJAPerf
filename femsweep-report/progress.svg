<text class="sub" x="24.0" y="52.0" text-anchor="start" xml:space="preserve" >ms per sweep, lower is better; the y axis starts at 15 ms. Original RAJA_CUDA: 100.5 ms, original Base_CUDA: 82.0 ms.</text>
