<rect class="none" x="149.0" y="189.0" width="32.0" height="168.0" rx="3" style="fill:none;stroke:var(--fg2);stroke-width:1.5;stroke-dasharray:4 3"/>
<rect class="none" x="183.0" y="189.0" width="168.0" height="168.0" rx="3" style="fill:none;stroke:var(--fg2);stroke-width:1.5"/>
<text class="small t2" x="165.0" y="376.0" text-anchor="middle" xml:space="preserve" >l = a·r</text>
<text class="small t2" x="267.0" y="376.0" text-anchor="middle" xml:space="preserve" >a -= l · (pivot row)</text>
<circle class="box" cx="440.0" cy="92.0" r="9"/>
<text class="small b" x="440.0" y="96.0" text-anchor="middle" xml:space="preserve" >1</text>
<text class="lab t2" x="456.0" y="96.0" text-anchor="start" xml:space="preserve" >Broadcast. The owner of row 2 (lane 2) shares entries 2…7 of</text>
<text class="lab t2" x="456.0" y="116.0" text-anchor="start" xml:space="preserve" >its row with the other lanes: 6 __shfl_sync calls.</text>
<circle class="box" cx="440.0" cy="132.0" r="9"/>
<text class="small b" x="440.0" y="136.0" text-anchor="middle" xml:space="preserve" >2</text>
<text class="lab t2" x="456.0" y="136.0" text-anchor="start" xml:space="preserve" >Reciprocal. Every lane computes r = 1/u₂₂ with femsweepRcp:</text>
<text class="lab t2" x="456.0" y="156.0" text-anchor="start" xml:space="preserve" >a hardware estimate plus two Newton steps, no slow-path branch.</text>
<circle class="box" cx="440.0" cy="172.0" r="9"/>
<text class="small b" x="440.0" y="176.0" text-anchor="middle" xml:space="preserve" >3</text>
<text class="lab t2" x="456.0" y="176.0" text-anchor="start" xml:space="preserve" >Keep r. The owner overwrites u₂₂ with r, since only the back</text>
<text class="lab t2" x="456.0" y="196.0" text-anchor="start" xml:space="preserve" >substitution reads the diagonal again: it then multiplies by r</text>
<text class="lab t2" x="456.0" y="216.0" text-anchor="start" xml:space="preserve" >instead of dividing by u₂₂.</text>
<circle class="box" cx="440.0" cy="232.0" r="9"/>
<text class="small b" x="440.0" y="236.0" text-anchor="middle" xml:space="preserve" >4</text>
<text class="lab t2" x="456.0" y="236.0" text-anchor="start" xml:space="preserve" >Eliminate. Each lane scales column 2 of its rows below 2 by r</text>
<text class="lab t2" x="456.0" y="256.0" text-anchor="start" xml:space="preserve" >(dashed) and subtracts multiples of the pivot row (solid box).</text>
<text class="lab t2" x="456.0" y="276.0" text-anchor="start" xml:space="preserve" ></text>
<text class="lab t2" x="456.0" y="296.0" text-anchor="start" xml:space="preserve" >Per element: 8 steps, 36 + 15 shuffles for LU and substitutions,</text>
<text class="lab t2" x="456.0" y="316.0" text-anchor="start" xml:space="preserve" >8 reciprocals, no divisions.</text>
