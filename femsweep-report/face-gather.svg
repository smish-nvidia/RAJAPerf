<rect class="bg" x="0" y="0" width="860" height="500" rx="8"/>
<text class="title" x="24.0" y="32.0" text-anchor="start" xml:space="preserve" >Step 1–2 of an element solve: upwind face terms into b</text>
<text class="sub" x="24.0" y="52.0" text-anchor="start" xml:space="preserve" >Shown for a direction whose incoming faces are x-, y-, z-; the face-to-dof map below is illustrative.</text>
<text class="lab b" x="24.0" y="88.0" text-anchor="start" xml:space="preserve" >Face table entry for (element e, local face): 8 ints, built once at setup (femsweepFaceTable)</text>
<rect class="box" x="24.0" y="98.0" width="86.0" height="30.0" rx="4" />
<text class="small t2" x="67.0" y="118.0" text-anchor="middle" xml:space="preserve" >Fdat offset</text>
<rect class="box" x="114.0" y="98.0" width="86.0" height="30.0" rx="4" />
<text class="small t2" x="157.0" y="118.0" text-anchor="middle" xml:space="preserve" >target dofs</text>
<rect class="box" x="204.0" y="98.0" width="176.0" height="30.0" rx="4" />
<text class="small t2" x="292.0" y="118.0" text-anchor="middle" xml:space="preserve" >unused</text>
<rect class="box" x="384.0" y="98.0" width="356.0" height="30.0" rx="4" />
<text class="small t2" x="562.0" y="118.0" text-anchor="middle" xml:space="preserve" >upwind dof index dis₀…dis₃</text>
<text class="small t3" x="24.0" y="146.0" text-anchor="start" xml:space="preserve" >Replaces the chain elem_to_faces -&gt; F_g2l -&gt; idx1/idx2, which needed 4 dependent loads per face. None of it depends on angle or group.</text>
<text class="lab b" x="24.0" y="180.0" text-anchor="start" xml:space="preserve" >Lane l computes face dof j = l on every face:</text>
<text class="mono" x="24.0" y="202.0" text-anchor="start" xml:space="preserve" >F = Σᵢ Ffactor · F[j][i] · X[disᵢ]</text>
<text class="lab t2" x="24.0" y="222.0" text-anchor="start" xml:space="preserve" >if the face is incoming and interior,</text>
<text class="lab t2" x="24.0" y="240.0" text-anchor="start" xml:space="preserve" >and writes it to face_b[face][dof(j)].</text>
<text class="lab t2" x="24.0" y="266.0" text-anchor="start" xml:space="preserve" >6 faces × 4 face dofs = 24 terms,</text>
<text class="lab t2" x="24.0" y="284.0" text-anchor="start" xml:space="preserve" >6 per lane.</text>
<text class="small t3" x="24.0" y="316.0" text-anchor="start" xml:space="preserve" >face_b lives in shared memory, one</text>
<text class="small t3" x="24.0" y="330.0" text-anchor="start" xml:space="preserve" >slice per group, stride 48 + 4 doubles</text>
<text class="small t3" x="24.0" y="344.0" text-anchor="start" xml:space="preserve" >(the padding avoids bank conflicts).</text>
<text class="lab b" x="360.0" y="182.0" text-anchor="start" xml:space="preserve" >face_b[face][element dof]</text>
<text class="small t3" x="377.0" y="202.0" text-anchor="middle" xml:space="preserve" >dof 0</text>
