<text x="380.0" y="527.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1a202c" text-anchor="middle">overlaps[n]: zero unless volume &gt; rel_tol * min(vol_a, vol_b)</text>
<text x="20.0" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a202c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-weight="bold">3  Drop the empty ones</text>
<text x="30.0" y="592.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1a202c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-weight="bold">thrust::remove_if(volume == 0)</text>
<text x="258.0" y="592.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">compact</text>
<text x="320.0" y="592.0" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a202c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">stable: still sorted by pair; then copied to the host as std::vector&lt;Overlap&gt;</text>
