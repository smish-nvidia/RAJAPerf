<text x="195.0" y="55.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="middle">A, B: hex meshes (vertices, 8 indices per hex),</text>
<text x="195.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="middle">copied to the device (DeviceMesh)</text>
<rect x="390.0" y="38.0" width="350.0" height="40.0" rx="6" fill="#c05621" fill-opacity="0.04" stroke="#a0aec0" stroke-width="1.2"/>
<text x="565.0" y="55.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="middle">A: hex mesh, copied to the device. B: a Cartesian</text>
<text x="565.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="middle">mesh: lo, hi and n[3] only (passed by value)</text>
<text x="20.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a202c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-weight="bold">1  Candidate pairs: elements whose bounding boxes overlap</text>
<rect x="20.0" y="110.0" width="350.0" height="178.0" rx="6" fill="#2b6cb0" fill-opacity="0.07" stroke="#2b6cb0" stroke-width="1.3"/>
<text x="32.0" y="132.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">compute_bounds</text>
<text x="360.0" y="132.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">build</text>
<text x="44.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a thread per hex of B: its box</text>
<text x="32.0" y="171.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">cuBQL::cuda::radixBuilder</text>
<text x="360.0" y="171.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">build</text>
<text x="44.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a BVH over B's boxes (Morton codes)</text>
<text x="32.0" y="210.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">append_pairs</text>
<text x="360.0" y="210.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">traversal</text>
<text x="44.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a thread per hex of A walks the BVH, appending</text>
<text x="44.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">(a, b) with an atomic counter, in any order</text>
<text x="32.0" y="264.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">thrust::sort</text>
<text x="360.0" y="264.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">sort</text>
<text x="44.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">by the 64-bit key (a &lt;&lt; 32 | b)</text>
<rect x="390.0" y="110.0" width="350.0" height="178.0" rx="6" fill="#c05621" fill-opacity="0.07" stroke="#c05621" stroke-width="1.3"/>
<text x="402.0" y="132.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c05621" text-anchor="start" font-weight="bold">count_cells</text>
<text x="730.0" y="132.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">traversal</text>
<text x="414.0" y="148.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a thread per hex of A: the cells its box spans,</text>
<text x="414.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">from cell_range on each axis: their number</text>
<text x="402.0" y="186.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c05621" text-anchor="start" font-weight="bold">thrust::exclusive_scan</text>
<text x="730.0" y="186.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">traversal</text>
<text x="414.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">counts -&gt; offsets (offsets[nA]: the total)</text>
<text x="402.0" y="225.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c05621" text-anchor="start" font-weight="bold">fill_cells</text>
<text x="730.0" y="225.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">traversal</text>
<text x="414.0" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a thread per hex of A writes its (a, b) from</text>
<text x="414.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">offsets[a] on, in order of cell index</text>
<line x1="195.0" y1="288.0" x2="195.0" y2="304.0" stroke="#2b6cb0" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-2b6cb0)"/>
<line x1="565.0" y1="288.0" x2="565.0" y2="304.0" stroke="#c05621" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-c05621)"/>
