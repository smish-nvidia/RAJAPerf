<text x="380.0" y="323.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#1a202c" text-anchor="middle">pairs[n]: (a, b), sorted by a, then b</text>
<text x="20.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a202c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-weight="bold">2  Moments: a warp box-tests its items, queues those that pass, and integrates the queue</text>
<rect x="20.0" y="376.0" width="350.0" height="116.0" rx="6" fill="#2b6cb0" fill-opacity="0.07" stroke="#2b6cb0" stroke-width="1.3"/>
<text x="32.0" y="398.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">hex_projection_moments</text>
<text x="360.0" y="398.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">moments</text>
<text x="44.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">24 triangles per hex: a warp per pair,</text>
<text x="44.0" y="429.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">its 24 x 24 = 576 items (T of A, S of B)</text>
<text x="32.0" y="452.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">hex_projection_moments_multi</text>
<text x="360.0" y="452.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">moments</text>
<text x="44.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">12 triangles per hex (INTSC_HEXHEX's subzones):</text>
<text x="44.0" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a warp per 4 pairs, their 4 x 144 items</text>
<rect x="390.0" y="376.0" width="350.0" height="116.0" rx="6" fill="#c05621" fill-opacity="0.07" stroke="#c05621" stroke-width="1.3"/>
<text x="402.0" y="398.0" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#c05621" text-anchor="start" font-weight="bold">cell_projection_moments</text>
<text x="730.0" y="398.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#718096" text-anchor="end">moments</text>
<text x="414.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">a warp per hex of A, over its cells 16 at a time:</text>
<text x="414.0" y="429.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a202c" text-anchor="start">24 items (triangle of A, cell) per cell</text>
<line x1="195.0" y1="492.0" x2="195.0" y2="508.0" stroke="#2b6cb0" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-2b6cb0)"/>
<line x1="565.0" y1="492.0" x2="565.0" y2="508.0" stroke="#c05621" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-c05621)"/>
